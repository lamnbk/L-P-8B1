function saveLink(e,id){e.preventDefault();const d={name:document.getElementById('lName').value.trim(),url:document.getElementById('lUrl').value.trim(),category:document.getElementById('lCat').value,desc:document.getElementById('lDesc').value.trim(),pinned:document.getElementById('lPin').checked};if(id)Object.assign(state.links.find(x=>x.id===id),d);else state.links.push({id:uid('l'),...d});saveState();mainModal.hide();renderPage()}function deleteLink(id){state.links=state.links.filter(x=>x.id!==id);saveState();renderPage()}
function renderStats(){const ss=classStudents(),tx=state.transactions.filter(x=>x.classId===state.activeClassId),total=ss.reduce((a,s)=>a+s.coins,0),plus=tx.filter(x=>x.amount>0).length,minus=tx.filter(x=>x.amount<0).length,male=ss.filter(s=>s.gender==='Nam').length,female=ss.filter(s=>s.gender==='Nữ').length;return `<div class="section-head"><div><h2><i class="fa-solid fa-chart-column text-primary me-2"></i>Thống Kê Điểm Xu & Lịch Sử Tích Đổi</h2><p>Tổng hợp thi đua theo lớp, theo môn và nhật ký cộng/trừ điểm.</p></div><div class="d-flex gap-2"><button class="btn btn-outline-primary" onclick="exportStatsXlsx()"><i class="fa-solid fa-file-excel me-1"></i>Xuất Excel đầy đủ</button><button class="btn btn-primary" onclick="exportStatsPDF()"><i class="fa-solid fa-file-pdf me-1"></i>Xuất PDF</button></div></div><div id="statsReport"><div class="stats-grid"><div class="stat-card"><div class="label">Sĩ số học sinh</div><div class="value">${ss.length}</div><small>${male} Nam · ${female} Nữ</small><i class="fa-solid fa-users"></i></div><div class="stat-card"><div class="label">Tổng xu thi đua</div><div class="value">${total}</div><small>${ss.length?Math.round(total/ss.length):0} xu TB/HS</small><i class="fa-solid fa-coins"></i></div><div class="stat-card"><div class="label">Lượt cộng (+xu)</div><div class="value">${plus}</div><small>Khen thưởng ghi nhận</small><i class="fa-solid fa-plus"></i></div><div class="stat-card"><div class="label">Lượt trừ (-xu)</div><div class="value">${minus}</div><small>Nhắc nhở nề nếp</small><i class="fa-solid fa-minus"></i></div></div><div class="grid-equal mt-3"><div class="card p-3"><h5 class="fw-bold">Bảng Xếp Hạng Xu Thi Đua</h5>${[...ss].sort((a,b)=>b.coins-a.coins).map((s,i)=>rankRow(s,i)).join('')}</div><div class="card p-3"><h5 class="fw-bold">Cơ Cấu Học Sinh & Tỷ Lệ Thi Đua</h5><div style="height:280px"><canvas id="genderChart"></canvas></div></div></div><div class="grid-equal mt-3"><div class="card p-3"><h5 class="fw-bold">Thống kê theo môn học</h5><div style="height:300px"><canvas id="subjectChart"></canvas></div></div><div class="card p-3"><h5 class="fw-bold">Xu theo học sinh</h5><div style="height:300px"><canvas id="coinChart"></canvas></div></div></div></div><div class="card p-3 mt-3"><div class="d-flex justify-content-between flex-wrap gap-2"><h5 class="fw-bold">Lịch sử Cộng / Trừ Chi Tiết (${tx.length})</h5><div class="d-flex gap-2"><select id="txSubjectFilter" class="form-select form-select-sm" onchange="filterTxTable()"><option value="">Tất cả môn</option>${state.subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="txSearch" class="form-control form-control-sm" placeholder="Tìm tên / lý do" oninput="filterTxTable()"></div></div><div class="table-responsive"><table class="table mt-2" id="txTable"><thead><tr><th>Thời gian</th><th>Học sinh</th><th>Môn</th><th>Lý do</th><th>Xu</th></tr></thead><tbody>${tx.map(txRow).join('')}</tbody></table></div></div>`}
function txRow(x){return `<tr data-subject="${esc(x.subject)}" data-search="${esc((x.studentName+' '+x.reason).toLowerCase())}"><td>${new Date(x.time).toLocaleString('vi-VN')}</td><td>${esc(x.studentName)}</td><td>${esc(x.subject)}</td><td>${esc(x.reason)}</td><td><span class="badge ${x.amount>=0?'bg-success':'bg-danger'}">${x.amount>=0?'+':''}${x.amount}</span></td></tr>`}
function filterTxTable(){const sub=document.getElementById('txSubjectFilter').value,q=document.getElementById('txSearch').value.toLowerCase();document.querySelectorAll('#txTable tbody tr').forEach(r=>r.style.display=(!sub||r.dataset.subject===sub)&&r.dataset.search.includes(q)?'':'none')}
function drawStatsCharts(){const ss=classStudents(),tx=state.transactions.filter(x=>x.classId===state.activeClassId);const m=ss.filter(s=>s.gender==='Nam').length,f=ss.filter(s=>s.gender==='Nữ').length,o=ss.length-m-f;const g=document.getElementById('genderChart');if(g)chartRefs.push(new Chart(g,{type:'doughnut',data:{labels:['Nam','Nữ','Khác'],datasets:[{data:[m,f,o],backgroundColor:['#0ea5e9','#f472b6','#94a3b8']}]},options:{maintainAspectRatio:false}}));const map={};tx.forEach(x=>map[x.subject]=(map[x.subject]||0)+x.amount);const sc=document.getElementById('subjectChart');if(sc)chartRefs.push(new Chart(sc,{type:'bar',data:{labels:Object.keys(map),datasets:[{label:'Xu ròng',data:Object.values(map),backgroundColor:'rgba(20,184,166,.7)',borderRadius:7}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}}));const cc=document.getElementById('coinChart');if(cc)chartRefs.push(new Chart(cc,{type:'line',data:{labels:ss.map(s=>s.name.split(' ').slice(-2).join(' ')),datasets:[{label:'Xu',data:ss.map(s=>s.coins),borderColor:'#0d9488',backgroundColor:'rgba(13,148,136,.12)',fill:true,tension:.3}]},options:{maintainAspectRatio:false}}))}
function exportStatsXlsx(){const ss=classStudents().map((s,i)=>({STT:i+1,'Học sinh':s.name,'Giới tính':s.gender,'Xu':s.coins}));const tx=state.transactions.filter(x=>x.classId===state.activeClassId).map(x=>({'Thời gian':new Date(x.time).toLocaleString('vi-VN'),'Học sinh':x.studentName,'Môn':x.subject,'Lý do':x.reason,'Xu':x.amount}));const red=state.redemptions.filter(x=>x.classId===state.activeClassId).map(x=>({'Thời gian':new Date(x.time).toLocaleString('vi-VN'),'Học sinh':x.studentName,'Quà':x.rewardName,'Chi phí xu':x.cost}));downloadXlsx([['Xếp hạng',ss],['Cộng trừ xu',tx],['Đổi quà',red]],`bao-cao-${activeClass().name}.xlsx`)}
async function exportStatsPDF(){const el=document.getElementById('statsReport');const canvas=await html2canvas(el,{scale:1.5,backgroundColor:'#fff'});const img=canvas.toDataURL('image/jpeg',.92);const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const w=190,h=canvas.height*w/canvas.width;let y=10;pdf.addImage(img,'JPEG',10,y,w,h);if(h>277){/* one long page scaled */}pdf.save(`bao-cao-${activeClass().name}.pdf`);toast('Đã tạo PDF')}
function downloadXlsx(sheets,filename){const wb=XLSX.utils.book_new();sheets.forEach(([name,rows])=>{const ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});XLSX.writeFile(wb,filename)}
function renderData(){const size=(new Blob([JSON.stringify(state)]).size/1024).toFixed(1);return `<div class="section-head"><div><h2><i class="fa-solid fa-database text-primary me-2"></i>Quản lý Dữ liệu</h2><p>Sao lưu dữ liệu định kỳ để chuyển máy hoặc khôi phục khi cần.</p></div></div><div class="grid-equal"><div class="card p-4"><h4 class="fw-bold">📦 Sao lưu toàn bộ</h4><p class="text-muted">Xuất mọi lớp, học sinh, điểm danh, xu, lịch, phần thưởng và cài đặt thành một tệp JSON.</p><button class="btn btn-primary" onclick="exportJSON()"><i class="fa-solid fa-download me-1"></i>Xuất file JSON sao lưu</button><div class="mt-3 small text-muted">Kích thước dữ liệu hiện tại: ~${size} KB</div></div><div class="card p-4"><h4 class="fw-bold">♻️ Khôi phục</h4><p class="text-muted">Nhập file JSON đã sao lưu từ ứng dụng này. Dữ liệu hiện tại sẽ được thay thế sau khi xác nhận.</p><button class="btn btn-outline-primary" onclick="document.getElementById('hiddenImport').click()"><i class="fa-solid fa-upload me-1"></i>Nhập file JSON</button></div></div><div class="card p-4 mt-3 border-danger"><h4 class="fw-bold text-danger">⚠️ Vùng dữ liệu nguy hiểm</h4><p class="text-muted">Đặt lại toàn bộ ứng dụng về dữ liệu mẫu ban đầu.</p><button class="btn btn-outline-danger" onclick="resetAllData()"><i class="fa-solid fa-trash-can me-1"></i>Xóa và tạo lại dữ liệu mẫu</button></div>`}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,`lop-hoc-vui-ve-backup-${today()}.json`);toast('Đã xuất bản sao lưu')}
async function importJSON(file){try{const text=await file.text(),obj=JSON.parse(text);if(!obj.version||!obj.classes||!obj.students)throw new Error('Sai cấu trúc');const r=await Swal.fire({icon:'warning',title:'Khôi phục dữ liệu?',text:'Dữ liệu hiện tại sẽ bị thay thế.',showCancelButton:true,confirmButtonText:'Khôi phục'});if(!r.isConfirmed)return;state=obj;saveState();buildNav();renderHeader();renderPage();toast('Khôi phục thành công')}catch(e){Swal.fire({icon:'error',title:'File không hợp lệ',text:e.message})}}
async function resetAllData(){const r=await Swal.fire({icon:'warning',title:'Đặt lại toàn bộ dữ liệu?',text:'Thao tác này không thể hoàn tác nếu chưa sao lưu.',showCancelButton:true,confirmButtonText:'Đặt lại',confirmButtonColor:'#dc2626'});if(!r.isConfirmed)return;state=defaultState();saveState();buildNav();renderHeader();renderPage()}
function renderSettings(){return `<div class="section-head"><div><h2><i class="fa-solid fa-gear text-primary me-2"></i>Cài đặt Hệ Thống & Hồ Sơ Giáo Viên</h2><p>Cập nhật thông tin cá nhân giáo viên, ảnh đại diện và danh sách môn học.</p></div></div><div class="grid-2"><div class="card setting-box"><h5 class="fw-bold"><i class="fa-regular fa-user text-primary me-1"></i>Thông Tin & Ảnh Đại Diện Giáo Viên</h5><form onsubmit="saveTeacher(event)"><div class="d-flex gap-3 align-items-center p-3 mt-3 rounded-4" style="border:2px dashed #99f6e4;background:#f0fdfa">${renderAvatar(state.teacher,'student-avatar')}<div class="flex-fill"><strong>Ảnh Đại Diện Giáo Viên</strong><div class="small text-muted">JPG, PNG, WEBP. Ảnh được lưu trực tiếp trong trình duyệt.</div><input id="teacherAvatarInput" type="file" accept="image/*" class="form-control mt-2"></div></div><div class="mt-3"><label class="form-label fw-bold">Họ và tên Giáo viên *</label><input id="tName" class="form-control" required value="${esc(state.teacher.name)}"></div><div class="row g-3 mt-0"><div class="col-md-6"><label class="form-label fw-bold">Vai trò / Chức vụ</label><input id="tRole" class="form-control" value="${esc(state.teacher.role)}"></div><div class="col-md-6"><label class="form-label fw-bold">Môn giảng dạy</label><input id="tSubject" class="form-control" value="${esc(state.teacher.subject)}"></div></div><div class="mt-3"><label class="form-label fw-bold">Tên trường học</label><input id="tSchool" class="form-control" value="${esc(state.teacher.school)}"></div><div class="text-end mt-4"><button class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu Hồ Sơ Giáo Viên</button></div></form></div><div><div class="card setting-box"><h5 class="fw-bold text-primary">✨ Mẹo Dành Cho Giáo Viên</h5><ul class="mt-3"><li class="mb-2">Cộng xu khi học sinh phát biểu hăng hái để tăng động lực.</li><li class="mb-2">Dùng Vòng quay hoặc Cuộn phim để sinh hoạt và gọi tên vui tươi.</li><li class="mb-2">Xuất file JSON sao lưu thường xuyên để dữ liệu luôn an toàn.</li><li>Dùng microphone Chống Ồn khi trình duyệt cho phép truy cập.</li></ul></div><div class="card setting-box mt-3"><h5 class="fw-bold">📚 Danh sách môn học</h5><p class="text-muted small">Các môn này xuất hiện khi cộng/trừ xu và lập thời khóa biểu.</p><div>${state.subjects.map(x=>`<span class="subject-chip">${esc(x)}</span>`).join('')}</div><button class="btn btn-outline-primary mt-3" onclick="editSubjects()">Tùy chỉnh danh sách môn</button></div></div></div>`}
async function saveTeacher(e){e.preventDefault();const f=document.getElementById('teacherAvatarInput').files[0];if(f)state.teacher.avatar=await readFileData(f);state.teacher.name=document.getElementById('tName').value.trim();state.teacher.role=document.getElementById('tRole').value.trim();state.teacher.subject=document.getElementById('tSubject').value.trim();state.teacher.school=document.getElementById('tSchool').value.trim();saveState();renderHeader();renderPage();toast('Đã cập nhật thông tin giáo viên')}
async function editSubjects(){const {value}=await Swal.fire({title:'Tùy chỉnh danh sách môn',input:'textarea',inputValue:state.subjects.join('\n'),inputLabel:'Mỗi dòng một môn / nhóm',showCancelButton:true,confirmButtonText:'Lưu danh sách'});if(value===undefined)return;state.subjects=value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);saveState();renderPage()}
function showModal(title,html){document.getElementById('mainModalTitle').textContent=title;document.getElementById('mainModalBody').innerHTML=html;mainModal.show()}
function showGuide(){Swal.fire({width:760,title:'Hướng dẫn nhanh',html:`<div class="text-start"><p><b>1. Lớp học:</b> tạo lớp và chọn lớp đang quản lý ở thanh trên.</p><p><b>2. Học sinh:</b> thêm hồ sơ, ảnh, cộng/trừ xu theo môn và lý do.</p><p><b>3. Điểm danh:</b> có 4 trạng thái: Có mặt, Đi muộn, Có phép, Không phép.</p><p><b>4. Sơ đồ lớp:</b> chọn 2 dãy bàn (mỗi dãy 6 hoặc 7 bàn, mỗi bàn ngồi 4 em, có thể để trống khi bàn ngồi 3), xếp ngẫu nhiên hoặc chọn từng bàn, sau đó xuất PNG.</p><p><b>5. Trò chơi:</b> Vòng quay và Cuộn phim chọn ngẫu nhiên, có thể loại người đã trúng và thưởng xu.</p><p><b>6. Chống ồn:</b> cảnh báo toàn màn hình, timer im lặng, đo âm lượng microphone.</p><p><b>7. Báo cáo:</b> thống kê theo học sinh/môn, xuất XLSX và PDF.</p><p><b>8. Dữ liệu:</b> mọi thứ lưu trong <code>localStorage</code>; nên xuất JSON để sao lưu.</p></div>`,confirmButtonText:'Đã hiểu'})}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function confettiLite(){for(let i=0;i<24;i++){const p=document.createElement('i');p.style.cssText=`position:fixed;z-index:100000;left:${Math.random()*100}vw;top:-10px;width:8px;height:12px;background:hsl(${Math.random()*360} 80% 55%);transform:rotate(${Math.random()*180}deg);transition:all ${1+Math.random()*1.4}s ease-in;pointer-events:none`;document.body.appendChild(p);requestAnimationFrame(()=>{p.style.top='105vh';p.style.transform+=` translateX(${(Math.random()-.5)*160}px) rotate(720deg)`});setTimeout(()=>p.remove(),2600)}}

document.addEventListener('DOMContentLoaded',()=>{mainModal=new bootstrap.Modal(document.getElementById('mainModal'));buildNav();renderHeader();renderPage();document.getElementById('hiddenImport').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''})});
</script>
</body>
</html>
